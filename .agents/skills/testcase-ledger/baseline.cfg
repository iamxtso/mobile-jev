\* The code as it is, on the inputs it creates itself: two runners recording, no killed runner, no
\* damaged line. Expected: no error.
CONSTANTS
  Writers = {"r1", "r2"}
  Cases = {"c1", "c2"}
  Verdicts = {"pass", "fail"}
  MaxAttempts = 2
  UseLock = TRUE
  AtomicCommit = TRUE
  CrashPossible = FALSE
  DamagePossible = FALSE
SPECIFICATION Spec
INVARIANTS
  TypeOK
  OneLinePerCase
  NoVerdictLost
  ReadersSeeWholeContent
  LockHeldByALiveWriter
ALIAS TraceView
