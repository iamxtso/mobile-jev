\* results.jsonl already holds a line that is not JSON, which is what an interrupted append-only
\* run of an earlier version of this tool leaves behind. Expected: NoVerdictLost violated.
CONSTANTS
  Writers = {"r1", "r2"}
  Cases = {"c1", "c2"}
  Verdicts = {"pass", "fail"}
  MaxAttempts = 2
  UseLock = TRUE
  AtomicCommit = TRUE
  CrashPossible = FALSE
  DamagePossible = TRUE
SPECIFICATION Spec
INVARIANTS
  NoVerdictLost
ALIAS TraceView
